<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chatBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#090f24"/>
      <stop offset="100%" stop-color="#02050f"/>
    </linearGradient>
    <linearGradient id="cyanVioletGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bubbleSender" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bubbleReceiver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="chatGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#chatBg)"/>
  <rect width="600" height="340" fill="url(#chatGrid)"/>
  <circle cx="480" cy="70" r="130" fill="#ec4899" opacity="0.14" filter="blur(30px)"/>
  <circle cx="120" cy="270" r="130" fill="#00F0FF" opacity="0.16" filter="blur(30px)"/>

  <!-- Android Phone Frame Mockup -->
  <g transform="translate(160, 25)">
    <!-- Phone Outer Body -->
    <rect width="280" height="260" rx="28" fill="#050914" stroke="url(#cyanVioletGlow)" stroke-width="2"/>
    
    <!-- Top Camera Notch / Speaker -->
    <rect x="105" y="8" width="70" height="4.5" rx="2.2" fill="#1e293b"/>
    <circle cx="95" cy="10" r="2.5" fill="#00F0FF" opacity="0.6"/>

    <!-- App Top Bar -->
    <g transform="translate(16, 22)">
      <!-- Avatar Stack with Heart -->
      <circle cx="14" cy="14" r="12" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="1.2"/>
      <text x="14" y="17.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#00F0FF" text-anchor="middle">S</text>
      
      <circle cx="28" cy="14" r="12" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.2"/>
      <text x="28" y="17.5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ec4899" text-anchor="middle">❤</text>

      <text x="48" y="12" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Private Android Space</text>
      <text x="48" y="22" font-family="'JetBrains Mono', monospace" font-size="7" fill="#10b981">● 2-Person Encrypted Tunnel</text>
      
      <path d="M235,10 L235,7 C235,5 236.5,3.5 238.5,3.5 C240.5,3.5 242,5 242,7 L242,10 M232,10 L245,10 L245,17 L232,17 Z" fill="none" stroke="#ec4899" stroke-width="1.2"/>
    </g>
    <line x1="0" y1="56" x2="280" y2="56" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Message 1 (Incoming from GF) -->
    <g transform="translate(16, 68)">
      <rect width="170" height="32" rx="12" fill="url(#bubbleReceiver)" stroke="#ec4899" stroke-opacity="0.4"/>
      <text x="10" y="15" font-family="sans-serif" font-size="9" fill="#fbcfe8">Hey, is this our private Android app? ✨</text>
      <text x="10" y="25" font-family="sans-serif" font-size="6.5" fill="#f472b6">10:14 PM • RSA-4096 Encrypted</text>
    </g>

    <!-- Message 2 (Outgoing from Sourav) -->
    <g transform="translate(90, 108)">
      <rect width="174" height="32" rx="12" fill="url(#bubbleSender)" stroke="#00F0FF" stroke-opacity="0.4"/>
      <text x="10" y="15" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="500">Yes! Just for the two of us. 🔒</text>
      <text x="10" y="25" font-family="sans-serif" font-size="6.5" fill="#38bdf8">10:15 PM • Biometric Authenticated</text>
    </g>

    <!-- Message 3 (Shared photo / audio memory snippet) -->
    <g transform="translate(16, 148)">
      <rect width="150" height="28" rx="10" fill="url(#bubbleReceiver)" stroke="#ec4899" stroke-opacity="0.4"/>
      <circle cx="14" cy="14" r="7" fill="#ec4899" fill-opacity="0.3"/>
      <path d="M12,11 L17,14 L12,17 Z" fill="#ffffff"/>
      <line x1="28" y1="14" x2="135" y2="14" stroke="#ec4899" stroke-width="2" stroke-dasharray="2,3"/>
    </g>

    <!-- Bottom Input Bar Mockup -->
    <g transform="translate(16, 185)">
      <rect width="248" height="28" rx="14" fill="#0b1329" stroke="#00F0FF" stroke-opacity="0.3"/>
      <text x="14" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Message your girlfriend...</text>
      <circle cx="230" cy="14" r="9" fill="#00F0FF" fill-opacity="0.2"/>
      <polygon points="228,10 236,14 228,18" fill="#00F0FF"/>
    </g>

    <!-- Home indicator bar -->
    <rect x="95" y="248" width="90" height="3" rx="1.5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Bottom Title Badge -->
  <text x="300" y="312" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" letter-spacing="2" fill="#00F0FF" opacity="0.95">ANDROID · EXCLUSIVE 2-PERSON CHAT APP</text>
</svg>
